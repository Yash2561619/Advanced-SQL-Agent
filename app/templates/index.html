<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced SQL Agent Chatbot</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
    
    <!-- Markdown Parser -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <style>
        :root {
            --primary: #6a11cb;
            --secondary: #c038ff;
            --dark-purple: #4a0e95;
            --background: #f4f7f9;
            --text: #333333;
            --light-text: #ffffff;
            --border: #e1e4e8;
            --third: #a047ff;
            --bubble: #ffffff;
            --bubble2: #eee5f8;
        }

        body {
            font-family: 'Poppins', sans-serif;
            margin: 0;
            padding: 0;
            background-color: var(--background);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .chat-button {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background-color: var(--dark-purple);
            color: var(--light-text);
            border: none;
            border-radius: 50%;
            width: 60px;
            height: 60px;
            font-size: 24px;
            cursor: pointer;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            transition: all 0.3s ease;
            z-index: 1000;
        }

        .chat-button:hover {
            transform: scale(1.1);
            box-shadow: 0 6px 12px rgba(106, 17, 203, 0.4);
        }

        .chat-container {
            width: 90%;
            max-width: 850px;
            height: 85vh;
            background-color: #ffffff;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: all 0.3s ease;
        }

        .chat-header {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: var(--light-text);
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .chat-title {
            font-size: 22px;
            font-weight: 600;
        }

        .window-controls {
            display: flex;
            gap: 10px;
        }

        .window-control {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            border: none;
            cursor: pointer;
            transition: opacity 0.3s ease;
        }

        .window-control:hover {
            opacity: 0.8;
        }

        #minimize-btn {
            background-color: #ffbd44;
        }

        #maximize-btn {
            background-color: #00ca4e;
        }

        #close-btn {
            background-color: #ff605c;
        }

        .chat-messages {
            flex-grow: 1;
            padding: 20px;
            overflow-y: auto;
            background-color: var(--background);
        }

        .message {
            margin-bottom: 15px;
            padding: 14px 18px;
            border-radius: 18px;
            max-width: 88%;
            animation: fadeIn 0.3s ease-out;
            font-size: 14.5px;
            line-height: 1.5;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.04);
            word-break: break-word;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .user-message {
            background-color: var(--bubble2);
            color: var(--text);
            align-self: flex-end;
            margin-left: auto;
            border-bottom-right-radius: 2px;
        }

        .bot-message {
            background-color: var(--bubble);
            color: var(--text);
            align-self: flex-start;
            border-bottom-left-radius: 2px;
            border: 1px solid var(--border);
        }

        /* Markdown Table Styling */
        .bot-message table {
            width: 100%;
            border-collapse: collapse;
            margin: 12px 0;
            font-size: 13px;
            background-color: #ffffff;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid #dcdfe4;
        }

        .bot-message th,
        .bot-message td {
            padding: 8px 12px;
            text-align: left;
            border: 1px solid #e2e5e9;
        }

        .bot-message th {
            background-color: #f3f4f8;
            font-weight: 600;
            color: var(--dark-purple);
        }

        .bot-message tr:nth-child(even) td {
            background-color: #fbfbfc;
        }

        .bot-message p {
            margin: 6px 0;
        }

        .bot-message ul,
        .bot-message ol {
            padding-left: 20px;
            margin: 6px 0;
        }

        .bot-message code {
            background: #f1f3f5;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 12.5px;
        }

        .bot-message pre {
            background: #282c34;
            color: #abb2bf;
            padding: 12px;
            border-radius: 8px;
            overflow-x: auto;
        }

        .chat-input {
            display: flex;
            padding: 18px 20px;
            background-color: #ffffff;
            border-top: 1px solid var(--border);
        }

        #user-input {
            flex-grow: 1;
            padding: 14px 20px;
            border: 1px solid var(--border);
            border-radius: 30px;
            font-size: 15px;
            outline: none;
            transition: border-color 0.3s ease;
        }

        #user-input:focus {
            border-color: var(--primary);
        }

        #send-button {
            padding: 14px 28px;
            background-color: var(--primary);
            color: var(--light-text);
            border: none;
            border-radius: 30px;
            margin-left: 12px;
            cursor: pointer;
            font-size: 15px;
            font-weight: 600;
            transition: background-color 0.3s ease;
        }

        #send-button:hover {
            background-color: var(--secondary);
        }

        .visualization-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 15px 0;
            padding: 15px;
            background-color: #ffffff;
            border-radius: 12px;
            border: 1px solid var(--border);
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
        }

        .visualization {
            max-width: 100%;
            max-height: 380px;
            object-fit: contain;
            border-radius: 6px;
        }

        .visualization-caption {
            margin-top: 8px;
            font-size: 13px;
            color: #666;
            text-align: center;
        }

        .loading {
            display: flex;
            align-items: center;
            justify-content: flex-start;
            padding: 12px 18px;
            background-color: #ffffff;
            border-radius: 12px;
            margin-bottom: 15px;
            animation: fadeIn 0.3s ease-out;
            width: fit-content;
            border: 1px solid var(--border);
        }

        .loading-text {
            color: #666666;
            margin-right: 12px;
            font-size: 13px;
        }

        .loading-spinner {
            border: 3px solid var(--border);
            border-top: 3px solid var(--primary);
            border-radius: 50%;
            width: 14px;
            height: 14px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .chat-container.minimized {
            height: 60px;
            overflow: hidden;
        }

        .chat-container.maximized {
            width: 100%;
            height: 100vh;
            max-width: none;
            border-radius: 0;
        }
    </style>
</head>

<body>
    <button class="chat-button" id="chat-button">💬</button>
    
    <div class="chat-container" id="chat-container">
        <div class="chat-header">
            <div class="window-controls">
                <button id="minimize-btn" class="window-control"></button>
                <button id="maximize-btn" class="window-control"></button>
                <button id="close-btn" class="window-control"></button>
            </div>
            <div class="chat-title">Advanced SQL Agent</div>
            <div style="width: 60px;"></div>
        </div>

        <div class="chat-messages" id="chat-messages">
            <div class="message bot-message">Hello! Ask any question about your database (e.g., top customers, revenue, orders).</div>
        </div>

        <div class="chat-input">
            <input type="text" id="user-input" placeholder="Ask a question about your data...">
            <button id="send-button">Send</button>
        </div>
    </div>

    <!-- Static JS Script -->
    <script src="{{ url_for('static', filename='js/chatbot.js') }}"></script>
</body>

</html>
